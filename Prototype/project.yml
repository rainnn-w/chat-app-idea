name: ChatMemory
options:
  bundleIdPrefix: com.rainnn
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  ChatMemoryPrototype:
    path: .

targets:
  ChatMemoryiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/ChatMemoryPrototypeApp
    dependencies:
      - package: ChatMemoryPrototype
        product: ChatMemoryUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rainnn.chatmemory.ios
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  ChatMemoryMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/ChatMemoryPrototypeApp
    dependencies:
      - package: ChatMemoryPrototype
        product: ChatMemoryUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rainnn.chatmemory.mac
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.0"

schemes:
  ChatMemoryiOS:
    build:
      targets:
        ChatMemoryiOS: all
    run:
      config: Debug
  ChatMemoryMac:
    build:
      targets:
        ChatMemoryMac: all
    run:
      config: Debug
