name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatMemory-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift 6
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Show Swift version
        run: swift --version

      - name: Run domain smoke tests
        working-directory: Prototype
        run: swift run DomainSmokeTests

      - name: Build ChatMemoryDomain
        working-directory: Prototype
        run: swift build --product ChatMemoryDomain

      - name: Build ChatMemoryUI
        working-directory: Prototype
        run: swift build --product ChatMemoryUI

      - name: Build ChatMemoryPrototypeApp
        working-directory: Prototype
        run: swift build --product ChatMemoryPrototypeApp
